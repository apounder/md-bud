name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run offline integration tests
        run: |
          chmod +x md-bud
          python3 -m unittest discover -s tests -v
